<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网页决策 · 逐步选择记录</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f8;--fg:#202833;--panel:#fff;--line:#d7dee6;--muted:#576475;--blue:#2469c9;--gold:#218353;--pick:#a352ce}
@media(prefers-color-scheme:dark){:root{--bg:#151a22;--fg:#e7ecf3;--panel:#202734;--line:#465166;--muted:#b4bdcd;--blue:#73aaf4;--gold:#65d29b;--pick:#d59afa}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg)}header{padding:20px 24px;border-bottom:1px solid var(--line)}h1{font-size:21px;margin:0 0 5px}h2{font-size:17px;margin:0 0 10px}p{margin:6px 0}.muted{color:var(--muted)}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 24px}select,button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px}select{max-width:100%;min-width:260px}button{cursor:pointer}label{display:flex;gap:7px;align-items:center}.layout{display:grid;grid-template-columns:minmax(360px,1.15fr) minmax(350px,1fr);gap:20px;margin:0 24px 24px}.panel{background:var(--panel);padding:18px;border:1px solid var(--line);border-radius:8px}.frame{max-height:720px;overflow:auto;border:1px solid var(--line);margin-top:10px}.picture{position:relative;width:100%}.picture img{display:block;width:100%;height:auto}.picture img[hidden]{display:none}.picture.zoom{width:max-content}.picture.zoom img{width:auto;max-width:none}.box{position:absolute;border:2px solid var(--blue);pointer-events:none;min-height:3px;min-width:3px}.box.selected{border:3px dashed var(--pick);z-index:3}.box.gold{outline:3px solid var(--gold);outline-offset:2px;z-index:2}.box.focus{background:color-mix(in srgb,var(--blue) 18%,transparent);z-index:1}.box span{position:absolute;top:0;left:0;background:var(--blue);color:white;font:12px/1.2 system-ui;padding:1px 3px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}.legend b{font-weight:600}table{width:100%;border-collapse:collapse;table-layout:fixed;margin:8px 0 20px}th,td{text-align:left;vertical-align:top;padding:7px 5px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th:first-child{width:63%}.bar{height:5px;background:var(--line);margin-top:4px}.bar i{display:block;height:100%;background:var(--blue)}.number{font-variant-numeric:tabular-nums}.mark{font-size:12px;font-weight:600;white-space:nowrap}.mark.p{color:var(--pick)}.mark.g{color:var(--gold)}.candidate{border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;text-decoration:underline;text-underline-offset:3px}.error{color:#c44339}.prompt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.status{font-variant-numeric:tabular-nums}details{margin-top:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:350px;overflow:auto}@media(max-width:820px){.layout{grid-template-columns:1fr;margin:0 12px 12px}.toolbar,header{padding:12px}.frame{max-height:560px}select{min-width:0;width:100%}}
</style></head><body>
<header><h1 id="model-title">网页决策 · 逐步选择记录</h1><div id="progress" class="status" aria-live="polite">读取记录…</div><p class="muted">离线截图与历史操作 → 候选评分 → 最终选择。只读查看；自建转换规则，非官网评测集的严格复现。</p></header>
<div class="toolbar"><label>模型 <select id="model" aria-label="选择评测模型"><option value="omnijev">OmniJev-4B v1.1</option><option value="qwen4b" selected>Qwen3.5-4B 原版</option></select></label><label>已完成的步骤 <select id="step" aria-label="选择已完成步骤"></select></label><button id="prev">上一步</button><button id="next">下一步</button><label><input id="live" type="checkbox" checked>跟随最新记录</label><label><input id="truth" type="checkbox" checked>显示正确答案</label><button id="refresh">刷新</button></div>
<main class="layout"><section class="panel"><h2 id="image-title">当前页面截图</h2><div class="legend"><b style="color:var(--blue)">蓝色：候选元素</b><b style="color:var(--pick)">紫色虚线：模型选择</b><b style="color:var(--gold)">绿色外框：正确答案</b></div><label style="margin-top:8px"><input id="zoom" type="checkbox">按原始像素查看截图</label><div class="frame" id="frame"><div class="picture" id="picture"><img id="image" alt="该操作步骤对应的原始网页截图"><div id="boxes"></div></div></div><p id="image-note" class="muted"></p></section>
<section class="panel"><p id="method" class="muted"></p><h2>任务与历史操作</h2><div id="prompt" class="prompt"></div><h2 style="margin-top:20px">下一步操作类型</h2><div id="op-result"></div><table><thead><tr><th>候选操作</th><th>概率</th></tr></thead><tbody id="ops"></tbody></table><h2>目标元素选择</h2><p class="muted">八个候选包含一个标注正确元素；此项只衡量候选内选择能力。点击候选可定位截图中的区域。</p><div id="target-result"></div><table><thead><tr><th>候选元素</th><th>概率</th></tr></thead><tbody id="targets"></tbody></table><details><summary>原始预测记录</summary><pre id="raw"></pre></details><p id="error" role="alert" class="error"></p></section></main><section class="panel" id="comparison-panel" style="margin:0 24px 24px" hidden><h2>同一批样本的结果对照</h2><table><thead><tr><th>评测项</th><th>OmniJev</th><th>Qwen3.5-4B</th></tr></thead><tbody id="comparison"></tbody></table></section>
<script>
let state={records:[]},index=0,busy=false;const $=id=>document.getElementById(id);const names={'click':'点击','type text':'输入文本','select from a dropdown':'下拉选择','scroll down':'向下滚动','scroll up':'向上滚动','go back':'返回','the task is done':'任务完成'};
function badges(cell,key,pred,gold){if(key===pred){let b=document.createElement('span');b.className='mark p';b.textContent=' · 模型选择';cell.append(b)}if($('truth').checked&&key===gold){let b=document.createElement('span');b.className='mark g';b.textContent=' · 正确答案';cell.append(b)}}
function table(id,answer,gold,options,isTarget){const body=$(id);body.replaceChildren();if(!answer)return;let entries=Object.entries(answer.probabilities).sort((a,b)=>b[1]-a[1]);for(const [key,p] of entries){let tr=document.createElement('tr'),td=document.createElement('td'),num=document.createElement('td');let text=options.find(o=>o.key===key)?.text||names[key]||key;if(isTarget){let b=document.createElement('button');b.className='candidate';b.textContent=key+' · '+text;b.onclick=()=>focusBox(key);td.append(b)}else td.textContent=text;badges(td,key,answer.choice,gold);num.className='number';num.textContent=(p*100).toFixed(2)+'%';let bar=document.createElement('div'),fill=document.createElement('i');bar.className='bar';fill.style.width=(p*100)+'%';bar.append(fill);num.append(bar);tr.append(td,num);body.append(tr)}let tr=document.createElement('tr'),td=document.createElement('td'),num=document.createElement('td');td.textContent='none of the above（弃权）';num.textContent=((answer.abstain||0)*100).toFixed(2)+'%';tr.append(td,num);body.append(tr)}
function focusBox(key){document.querySelectorAll('.box.focus').forEach(b=>b.classList.remove('focus'));let b=document.getElementById('box-'+key);if(b){b.classList.add('focus');const f=$('frame');f.scrollTop=b.offsetTop-f.clientHeight/2+b.offsetHeight/2;f.scrollLeft=b.offsetLeft-f.clientWidth/2+b.offsetWidth/2}}
function result(id,answer,gold,correct){$(id).textContent=answer?'模型选择：'+(names[answer.choice]||answer.choice)+(answer.valid?'':'（API 判定弃权）')+($('truth').checked?'；标注答案：'+(names[gold]||gold)+'；'+(correct?'正确':'错误'):''): '该步骤无可评测的目标元素候选，因此仅评测操作类型。'}
function draw(){if(!state.records.length){$('image').removeAttribute('src');$('image').hidden=true;$('boxes').replaceChildren();$('ops').replaceChildren();$('targets').replaceChildren();$('prompt').textContent='等待该模型的首条预测记录…';$('op-result').textContent='';$('target-result').textContent='';$('raw').textContent='';$('image-note').textContent='';$('image-title').textContent='当前页面截图';$('prev').disabled=true;$('next').disabled=true;return;}$('image').hidden=false;index=Math.max(0,Math.min(index,state.records.length-1));$('step').value=String(index);let r=state.records[index];$('image-title').textContent=r.family+' · '+r.website+' · 历史中的第 '+(r.action_index+1)+' 步';if($('image').getAttribute('src')!==r.image_url){$('image').src=r.image_url;$('frame').scrollTop=0}$('picture').classList.toggle('zoom',$('zoom').checked);$('prompt').textContent=r.questions.op.instructions;$('image-note').textContent=r.image_size.join(' × ')+' 像素；推理耗时 '+r.wall_seconds.toFixed(2)+' 秒；ID '+r.action_uid;$('boxes').replaceChildren();for(let i=0;i<r.candidates.length;i++){let c=r.candidates[i],key='element_'+(i+1),b=document.createElement('div');b.className='box';b.id='box-'+key;if(r.answers.target?.choice===key)b.classList.add('selected');if($('truth').checked&&r.labels.target===key)b.classList.add('gold');let [x0,y0,x1,y1]=c.box;Object.assign(b.style,{left:x0/10+'%',top:y0/10+'%',width:(x1-x0)/10+'%',height:(y1-y0)/10+'%'});let label=document.createElement('span');label.textContent=String(i+1);b.append(label);$('boxes').append(b)}result('op-result',r.answers.op,r.labels.op,r.correct.op);result('target-result',r.answers.target,r.labels.target,r.correct.target);table('ops',r.answers.op,r.labels.op,r.questions.op.options,false);table('targets',r.answers.target,r.labels.target,r.questions.target?.options||[],true);$('raw').textContent=JSON.stringify({action_uid:r.action_uid,family:r.family,labels:$('truth').checked?r.labels:undefined,answers:r.answers,wall_seconds:r.wall_seconds},null,2);$('prev').disabled=index===0;$('next').disabled=index===state.records.length-1}
async function load(){if(busy)return;busy=true;try{let response=await fetch('/api/state?model='+encodeURIComponent($('model').value),{cache:'no-store'});if(!response.ok)throw Error('读取失败 '+response.status);let latest=await response.json(),previous=state.records[index]?.action_uid;state=latest;$('model-title').textContent=state.model+' · 逐步选择记录';$('method').textContent=state.method;renderComparison();$('progress').textContent='已完成 '+state.done+' / '+state.total+' 步 · '+(state.finished?'评测完成':'进行中')+' · 每 5 秒更新';$('step').replaceChildren(...state.records.map((r,i)=>{let o=document.createElement('option');o.value=String(i);o.textContent=(i+1)+' / '+state.total+' · '+r.family+' · '+r.website+' · '+r.action_uid.slice(0,8);return o}));if($('live').checked)index=state.records.length-1;else if(previous){let i=state.records.findIndex(r=>r.action_uid===previous);if(i>=0)index=i}draw();$('error').textContent=''}catch(e){$('error').textContent=e.message}finally{busy=false}}
function renderComparison(){const c=state.comparison;$('comparison-panel').hidden=!c;if(!c)return;$('comparison').replaceChildren();for(const family of ['web','webtest']){for(const [key,title] of [['op','操作类型'],['target','候选元素'],['joint','两项同时正确']]){const tr=document.createElement('tr'),label=document.createElement('td');label.textContent=family+' · '+title;tr.append(label);for(const summary of [c.omnijev_summary,c.qwen_summary]){const f=summary.families[family],m=key==='joint'?{accuracy_percent:f.joint_accuracy_percent,correct:f.joint_correct,total:f.joint_total}:f.metrics[key];let td=document.createElement('td');td.className='number';td.textContent=m.accuracy_percent.toFixed(2)+'% ('+m.correct+'/'+m.total+')';tr.append(td)}$('comparison').append(tr)}}} $('model').onchange=()=>{$('live').checked=false;load()};$('step').onchange=()=>{$('live').checked=false;index=Number($('step').value);draw()};$('prev').onclick=()=>{$('live').checked=false;index--;draw()};$('next').onclick=()=>{$('live').checked=false;index++;draw()};$('truth').onchange=draw;$('zoom').onchange=draw;$('live').onchange=load;$('refresh').onclick=load;load();setInterval(load,5000);
</script></body></html>
